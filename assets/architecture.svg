<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 705" width="1000" height="705" font-family="Georgia, 'Times New Roman', Times, serif" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <style>
      .band { fill: #f5f5f3; stroke: #cfcfca; stroke-width: 1; }
      .bl   { font-size: 9.5px; letter-spacing: 0.8px; fill: #555; font-weight: bold; }
      .box  { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
      .llm  { fill: #e8eef8; stroke: #1a1a1a; stroke-width: 1.2; }
      .t    { font-size: 13.5px; font-weight: bold; text-anchor: middle; }
      .d    { font-size: 11.5px; text-anchor: middle; fill: #333; }
      .e    { fill: none; stroke: #1a1a1a; stroke-width: 1.2; }
      .o    { fill: none; stroke: #777; stroke-width: 1.1; stroke-dasharray: 2 3; }
      .cap  { font-size: 11px; font-style: italic; fill: #8b1a1a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1000" height="705" fill="#ffffff"/>

  <!-- Layer bands -->
  <rect class="band" x="15" y="15"  width="970" height="105"/>
  <rect class="band" x="15" y="135" width="970" height="170"/>
  <rect class="band" x="15" y="335" width="970" height="200"/>
  <rect class="band" x="15" y="550" width="970" height="105"/>

  <text class="bl" x="24" y="72">DATA</text>
  <text class="bl" x="24" y="215">DETERMINISTIC</text>
  <text class="bl" x="24" y="231">ANALYTICS</text>
  <text class="bl" x="24" y="430">GROUNDED</text>
  <text class="bl" x="24" y="446">REASONING</text>
  <text class="bl" x="24" y="607">PRESENTATION</text>

  <!-- Data layer -->
  <rect class="box" x="140" y="37" width="320" height="60"/>
  <text class="t" x="300" y="62">Synthetic data generator</text>
  <text class="d" x="300" y="80">simulated SaaS billing lifecycle</text>

  <rect class="box" x="560" y="37" width="390" height="60"/>
  <text class="t" x="755" y="62">Account × month panel</text>
  <text class="d" x="755" y="80">112 attributes: MRR events, segments, telemetry</text>

  <!-- Deterministic analytics layer -->
  <rect class="box" x="140" y="180" width="190" height="80"/>
  <text class="t" x="235" y="212">Ingestion</text>
  <text class="d" x="235" y="230">schema validation,</text>
  <text class="d" x="235" y="245">period indexing</text>

  <rect class="box" x="370" y="160" width="330" height="115"/>
  <text class="t" x="535" y="185">Revenue analytics engine</text>
  <text class="d" x="535" y="207">period comparison · variance ranking</text>
  <text class="d" x="535" y="225">driver decomposition (account, segment, event)</text>
  <text class="d" x="535" y="243">concentration: top-k share, HHI</text>
  <text class="d" x="535" y="261">MRR bridge (opening + expansion − losses)</text>

  <rect class="box" x="730" y="160" width="220" height="115"/>
  <text class="t" x="840" y="185">Systemic risk graph</text>
  <text class="d" x="840" y="207"><tspan font-style="italic">G</tspan> = (<tspan font-style="italic">V</tspan>, <tspan font-style="italic">E</tspan>, <tspan font-style="italic">W</tspan>):</text>
  <text class="d" x="840" y="225">risk source → loss → account</text>
  <text class="d" x="840" y="243">PageRank cascade score</text>
  <text class="d" x="840" y="261">loss-path tracing</text>

  <!-- Evidence boundary -->
  <line x1="15" y1="320" x2="985" y2="320" stroke="#8b1a1a" stroke-width="1.4" stroke-dasharray="7 4"/>
  <rect x="402" y="306" width="276" height="16" fill="#ffffff"/>
  <text class="cap" x="540" y="318">evidence contract: Variance · Driver · Transaction</text>

  <!-- Grounded reasoning layer -->
  <rect class="box" x="140" y="360" width="230" height="80"/>
  <text class="t" x="255" y="385">Investigation agent</text>
  <text class="d" x="255" y="405">driver selection, evidence</text>
  <text class="d" x="255" y="421">retrieval, historical context</text>

  <rect class="box" x="140" y="465" width="230" height="46"/>
  <text class="t" x="255" y="485">Confirmed-context memory</text>
  <text class="d" x="255" y="501">SQLite, per account</text>

  <rect class="llm" x="440" y="360" width="250" height="80"/>
  <text class="t" x="565" y="385">Explanation generator</text>
  <text class="d" x="565" y="405">verbalises supplied facts only</text>
  <text class="d" x="565" y="421">Claude → GPT → template</text>

  <rect class="llm" x="730" y="360" width="220" height="80"/>
  <text class="t" x="840" y="385">Narrative verifier</text>
  <text class="d" x="840" y="405">deterministic claim verdict;</text>
  <text class="d" x="840" y="421">LLM phrases rationale</text>

  <rect class="box" x="470" y="470" width="220" height="36" stroke-dasharray="4 3"/>
  <text class="d" x="580" y="493">LLM trace observability</text>

  <!-- Presentation layer -->
  <rect class="box" x="140" y="578" width="240" height="60"/>
  <text class="t" x="260" y="603">Executive overview</text>
  <text class="d" x="260" y="621">KPIs, revenue quality, agent Q&amp;A</text>

  <rect class="box" x="440" y="578" width="250" height="60"/>
  <text class="t" x="565" y="603">Claim fact-check</text>
  <text class="d" x="565" y="621">investor statements vs. evidence</text>

  <rect class="box" x="730" y="578" width="220" height="60"/>
  <text class="t" x="840" y="603">Risk-graph explorer</text>
  <text class="d" x="840" y="621">cascade ranking, loss paths</text>

  <!-- Edges -->
  <path class="e" d="M460,67 H558" marker-end="url(#a)"/>
  <path class="e" d="M640,97 V127 H235 V178" marker-end="url(#a)"/>
  <path class="e" d="M840,97 V158" marker-end="url(#a)"/>
  <path class="e" d="M330,220 H368" marker-end="url(#a)"/>

  <path class="e" d="M395,275 V343 H255 V358" marker-end="url(#a)"/>
  <path class="e" d="M685,275 V343 H840 V358" marker-end="url(#a)"/>

  <path class="e" d="M370,400 H438" marker-end="url(#a)"/>
  <path class="e" d="M255,442 V463" marker-start="url(#a)" marker-end="url(#a)"/>

  <path class="o" d="M580,440 V468" marker-end="url(#g)"/>
  <path class="o" d="M730,420 H710 V488 H692" marker-end="url(#g)"/>

  <path class="e" d="M460,440 V543 H260 V576" marker-end="url(#a)"/>
  <path class="e" d="M840,440 V543 H565 V576" marker-end="url(#a)"/>
  <path class="e" d="M950,217 H968 V608 H952" marker-end="url(#a)"/>

  <!-- Legend -->
  <rect class="box" x="140" y="673" width="18" height="12"/>
  <text x="166" y="683" font-size="11.5">deterministic</text>
  <rect class="llm" x="270" y="673" width="18" height="12"/>
  <text x="296" y="683" font-size="11.5">LLM-assisted (optional; falls back to deterministic template)</text>
  <line x1="660" y1="679" x2="690" y2="679" stroke="#8b1a1a" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="698" y="683" font-size="11.5">numeric values immutable below</text>
</svg>
